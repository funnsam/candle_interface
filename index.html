<!DOCTYPE html>
<head>
    <meta charset="utf8">
    <title>控制台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="prefetch" href="script.js" as="script">
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
</head>
<body>
    <div id="info_div">
        <div><b>系統時間:</b> <span id="system_time_span"></span></div>
        <div><b>上線時間:</b> <span id="uptime_span"></span></div>
        <div><b>剩餘記憶體:</b> <span id="heap_free_span"></span>B
            (最低: <span id="heap_min_free_span"></span>B)
        </div>

        <hr>

        <div><b>錯誤信息:</b> <span id="last_error_span"></span></div>

        <hr>

        <div><b>上次畫面更新:</b> <span id="last_update_span"></span> 前</div>
        <div><b>下次畫面更新:</b> 大約 <span id="next_update_span"></span> 後
            (每隔約 <span id="interval_span"></span>)
        </div>
    </div>
    <div id="control_div">
        <button id="refresh_btn" disabled>立即更新畫面</button>
        <button id="restart_btn" disabled>重新開機</button>

        <hr>

        <button onclick="startSocket()">重新連接</button>
    </div>

    <dialog id="error_dialog" class="dialog" closedby="none">
        <h1>錯誤</h1>
        意外地與裝置斷線: <span id="error_span"></span>
        <div class="actions">
            <button id="error_reconnect" command="close" commandfor="error_dialog">重新連接</button>
            <button command="close" commandfor="error_dialog">確定</button>
        </div>
    </dialog>
    <dialog id="reconnect_dialog" class="snackbar">
        重新連接中
        <button class="icon" command="close" commandfor="reconnect_dialog">&#x2715;</button>
    </dialog>
    <script src="script.js"></script>
</body>
